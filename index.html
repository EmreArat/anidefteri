<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Düğün Anılarımız</title>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,600;1,400&family=Great+Vibes&family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">

    <style>
        body {
            font-family: 'Poppins', sans-serif;
            background-color: #fdfaf3;
            color: #4a4a4a;
            background-image: url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='noiseFilter'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.85' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23noiseFilter)' opacity='0.05'/%3E%3C/svg%3E");
        }
        h1, h2 { font-family: 'Cormorant Garamond', serif; }
        .font-script { font-family: 'Great Vibes', cursive; }

        .upload-area {
            border: 2px dashed #b45309;
            transition: all 0.3s ease;
        }
        .upload-area:hover, .upload-area.dragover {
            background-color: #fef3c7;
            border-color: #92400e;
        }
        .btn-primary {
            background-color: #92400e;
            color: white;
            transition: all 0.3s ease;
        }
        .btn-primary:hover {
            background-color: #78350f;
            transform: translateY(-2px);
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        .btn-primary:disabled {
            background-color: #d1d5db;
            cursor: not-allowed;
            transform: none;
            box-shadow: none;
        }

        .btn-secondary {
            background-color: #fffbeb;
            color: #78350f;
            border: 1px solid rgba(146, 64, 14, 0.25);
            transition: all 0.2s ease;
        }
        .btn-secondary:active { background-color: #fef3c7; }

        .loader {
            border: 3px solid #f3f3f3;
            border-top: 3px solid #92400e;
            border-radius: 50%;
            width: 24px;
            height: 24px;
            animation: spin 1s linear infinite;
            display: inline-block;
            vertical-align: middle;
            margin-right: 8px;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .celebration-wrapper {
            position: relative;
            padding: 0.5rem 0 1.5rem 0;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
        }
        .heart-burst {
            position: relative;
            width: 70px;
            height: 70px;
            display: flex;
            align-items: center;
            justify-content: center;
            animation: popIn 0.6s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards;
            z-index: 10;
        }
        .heart-burst .fa-heart {
            font-size: 4rem;
            color: #b45309;
            filter: drop-shadow(0 4px 6px rgba(180, 83, 9, 0.3));
        }
        .heart-burst .fa-check {
            position: absolute;
            font-size: 1.75rem;
            color: white;
            animation: popIn 0.5s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards 0.4s;
            opacity: 0;
        }
        .sparkle {
            position: absolute;
            width: 8px;
            height: 8px;
            background-color: #d97706;
            border-radius: 50%;
            opacity: 0;
            z-index: 1;
        }
        .sparkle-1 { animation: shoot1 1s ease-out forwards 0.1s; }
        .sparkle-2 { animation: shoot2 1s ease-out forwards 0.2s; }
        .sparkle-3 { animation: shoot3 1s ease-out forwards 0.3s; }
        .sparkle-4 { animation: shoot4 1s ease-out forwards 0.1s; }
        .sparkle-5 { animation: shoot5 1s ease-out forwards 0.2s; }
        .sparkle-6 { animation: shoot6 1s ease-out forwards 0.3s; }

        @keyframes popIn {
            0% { transform: scale(0) rotate(-10deg); opacity: 0; }
            80% { transform: scale(1.1) rotate(5deg); opacity: 1; }
            100% { transform: scale(1) rotate(0deg); opacity: 1; }
        }
        @keyframes textReveal {
            0% { opacity: 0; transform: translateY(10px); }
            100% { opacity: 1; transform: translateY(0); }
        }
        @keyframes shoot1 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(-40px, -40px) scale(0); opacity: 0; } }
        @keyframes shoot2 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(40px, -40px) scale(0); opacity: 0; } }
        @keyframes shoot3 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(-50px, 10px) scale(0); opacity: 0; } }
        @keyframes shoot4 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(50px, 10px) scale(0); opacity: 0; } }
        @keyframes shoot5 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(-30px, 40px) scale(0); opacity: 0; } }
        @keyframes shoot6 { 0% { transform: translate(0,0) scale(1); opacity: 1; } 100% { transform: translate(30px, 40px) scale(0); opacity: 0; } }

        .celeb-title {
            font-size: 1.75rem;
            color: #78350f;
            margin-top: 1rem;
            font-family: 'Cormorant Garamond', serif;
            animation: textReveal 0.8s ease-out forwards 0.5s;
            opacity: 0;
            font-weight: 600;
        }
        .celeb-text {
            color: #6b7280;
            margin-top: 0.25rem;
            animation: textReveal 0.8s ease-out forwards 0.7s;
            opacity: 0;
            font-size: 0.9rem;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-white/90 backdrop-blur-sm rounded-2xl shadow-xl overflow-hidden relative z-10 p-6 md:p-8 border border-amber-900/10">

        <div class="absolute top-0 left-0 w-full h-2 bg-gradient-to-r from-amber-200 via-amber-600 to-amber-200"></div>

        <div class="text-center mb-6">
            <h1 class="text-3xl md:text-4xl font-bold text-amber-900 mb-1 font-serif tracking-wide drop-shadow-xs">Anı Defterimiz</h1>
            <p class="text-xs md:text-sm text-gray-600">Bugün bizimle olduğunuz için teşekkür ederiz. Lütfen çektiğiniz en güzel anları bizimle paylaşın.</p>
        </div>

        <div id="statusMessage" class="hidden text-center mb-6 p-4 rounded-xl text-sm"></div>

        <form id="uploadForm" class="space-y-5">

            <div>
                <label for="guestName" class="block text-xs font-semibold uppercase tracking-wider text-amber-900/70 mb-1">Adınız / Soyadınız (İsteğe Bağlı)</label>
                <input type="text" id="guestName" placeholder="Örn: Ayşe & Ali" class="w-full px-4 py-2.5 text-sm border border-amber-900/20 rounded-lg focus:ring-2 focus:ring-amber-700/30 focus:border-amber-800 outline-none transition bg-amber-50/30">
            </div>

            <!--
              ÖNEMLİ: accept özniteliği BİLEREK kaldırıldı.
              accept="image/*,video/*" yazıldığında Android Intent Resolver
              çoğu cihazda sadece kamera uygulamalarını listeliyor, galeri kayboluyor.
              Ayrıca HEIC/HEIF gibi formatlar filtrede gri görünüyor.
              Doğrulama artık JS tarafında yapılıyor.
            -->
            <div class="upload-area rounded-xl p-6 text-center cursor-pointer relative bg-amber-50/20" id="dropZone">
                <input type="file" id="fileInput" class="hidden" multiple>
                <input type="file" id="cameraInput" class="hidden" accept="image/*" capture="environment">

                <div id="uploadPrompt">
                    <i class="fa-solid fa-cloud-arrow-up text-3xl text-amber-700 mb-2"></i>
                    <p class="text-gray-700 font-medium text-sm">Fotoğraf veya Video Seçin</p>
                    <p class="text-[11px] text-gray-400 mt-1">Birden fazla dosya seçebilirsiniz</p>
                </div>

                <div id="filePreview" class="hidden text-left">
                    <div class="flex justify-between items-center mb-2 border-b border-amber-900/10 pb-1">
                        <h3 class="text-xs font-bold text-amber-900 uppercase tracking-wide">Seçilen Dosyalar</h3>
                        <button type="button" class="text-xs text-red-500 hover:text-red-700 underline font-medium" onclick="event.stopPropagation(); clearSelection()">Tümünü Temizle</button>
                    </div>
                    <ul id="fileList" class="text-xs text-gray-600 space-y-1.5 max-h-36 overflow-y-auto pr-1"></ul>
                </div>
            </div>

            <!-- Kamera için ayrı, net bir yol. Böylece ana buton her zaman galeriyi/dosyaları açar. -->
            <button type="button" id="cameraBtn" class="w-full btn-secondary py-2.5 px-4 rounded-xl font-medium text-sm flex items-center justify-center">
                <i class="fa-solid fa-camera mr-2"></i> Kamera ile Çek
            </button>

            <button type="submit" id="submitBtn" disabled class="w-full btn-primary py-3 px-4 rounded-xl font-semibold text-base flex items-center justify-center shadow-md">
                <span>Anıları Yükle</span>
            </button>

        </form>

        <div class="mt-6 text-center">
            <span class="text-amber-800/40 text-xs tracking-widest uppercase">#MerveFurkanWedding</span>
        </div>
    </div>

    <script>
        const SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbw58Ggc-1hvzTtbhG5Yviwv_NDv2ox-6tWx5fmF1ln2uMVtIT2spXkque6g_Wxa1ik/exec';

        const dropZone = document.getElementById('dropZone');
        const fileInput = document.getElementById('fileInput');
        const cameraInput = document.getElementById('cameraInput');
        const cameraBtn = document.getElementById('cameraBtn');
        const uploadPrompt = document.getElementById('uploadPrompt');
        const filePreview = document.getElementById('filePreview');
        const fileList = document.getElementById('fileList');
        const submitBtn = document.getElementById('submitBtn');
        const uploadForm = document.getElementById('uploadForm');
        const statusMessage = document.getElementById('statusMessage');
        let selectedFiles = [];

        /* ---------- MIME tespiti ----------
           Android + bazı dosya yöneticileri file.type'ı boş ("") gönderiyor.
           Bu durumda Drive dosyayı tanımıyor. Uzantıdan tamamlıyoruz. */
        const EXT_MIME = {
            jpg: 'image/jpeg', jpeg: 'image/jpeg', jpe: 'image/jpeg', jfif: 'image/jpeg',
            png: 'image/png', gif: 'image/gif', webp: 'image/webp', bmp: 'image/bmp',
            tif: 'image/tiff', tiff: 'image/tiff', svg: 'image/svg+xml', avif: 'image/avif',
            heic: 'image/heic', heif: 'image/heif', heics: 'image/heic-sequence',
            dng: 'image/x-adobe-dng', cr2: 'image/x-canon-cr2', nef: 'image/x-nikon-nef',
            arw: 'image/x-sony-arw', raf: 'image/x-fuji-raf', orf: 'image/x-olympus-orf',
            mp4: 'video/mp4', m4v: 'video/x-m4v', mov: 'video/quicktime', qt: 'video/quicktime',
            avi: 'video/x-msvideo', mkv: 'video/x-matroska', webm: 'video/webm',
            '3gp': 'video/3gpp', '3g2': 'video/3gpp2', mpg: 'video/mpeg', mpeg: 'video/mpeg',
            wmv: 'video/x-ms-wmv', flv: 'video/x-flv', mts: 'video/mp2t', m2ts: 'video/mp2t'
        };

        function getExt(name) {
            const i = name.lastIndexOf('.');
            return i === -1 ? '' : name.slice(i + 1).toLowerCase();
        }

        function resolveMime(file) {
            if (file.type && file.type !== 'application/octet-stream') return file.type;
            return EXT_MIME[getExt(file.name)] || 'application/octet-stream';
        }

        function isMedia(file) {
            const mime = resolveMime(file);
            if (mime.startsWith('image/') || mime.startsWith('video/')) return true;
            // Tanınmayan uzantıyı da reddetmiyoruz; misafirin dosyası kaybolmasın.
            return getExt(file.name) !== '';
        }

        function isImage(file) { return resolveMime(file).startsWith('image/'); }
        function isVideo(file) { return resolveMime(file).startsWith('video/'); }

        /* ---------- Dosya seçimi ---------- */
        dropZone.addEventListener('click', () => fileInput.click());
        cameraBtn.addEventListener('click', () => cameraInput.click());

        fileInput.addEventListener('change', () => {
            addFiles(fileInput.files);
            fileInput.value = '';
        });
        cameraInput.addEventListener('change', () => {
            addFiles(cameraInput.files);
            cameraInput.value = '';
        });

        dropZone.addEventListener('dragover', (e) => { e.preventDefault(); dropZone.classList.add('dragover'); });
        dropZone.addEventListener('dragleave', () => { dropZone.classList.remove('dragover'); });
        dropZone.addEventListener('drop', (e) => {
            e.preventDefault();
            dropZone.classList.remove('dragover');
            addFiles(e.dataTransfer.files);
        });

        function addFiles(newFilesList) {
            const newFiles = Array.from(newFilesList).filter(isMedia);
            if (newFiles.length === 0) return;
            selectedFiles = selectedFiles.concat(newFiles);
            updateUI();
        }

        function updateUI() {
            if (selectedFiles.length > 0) {
                uploadPrompt.classList.add('hidden');
                filePreview.classList.remove('hidden');
                submitBtn.disabled = false;

                fileList.innerHTML = '';
                selectedFiles.forEach((file, index) => {
                    const li = document.createElement('li');
                    li.className = "flex justify-between items-center py-1.5 px-2 bg-white rounded-lg border border-amber-900/5 shadow-2xs";

                    const sizeMB = (file.size / (1024 * 1024)).toFixed(1);
                    let icon = 'fa-file text-gray-500';
                    if (isImage(file)) icon = 'fa-image text-amber-700';
                    if (isVideo(file)) icon = 'fa-video text-amber-900';

                    li.innerHTML = `
                        <div class="truncate pr-2 flex items-center space-x-2">
                            <i class="fa-solid ${icon}"></i>
                            <span class="truncate text-gray-700 font-medium" title="${file.name}">${file.name}</span>
                            <span class="text-[10px] text-gray-400">(${sizeMB} MB)</span>
                        </div>
                        <button type="button" class="text-red-400 hover:text-red-600 p-1 flex-shrink-0" onclick="event.stopPropagation(); removeFile(${index})" title="Kaldır">
                            <i class="fa-solid fa-xmark text-sm"></i>
                        </button>
                    `;
                    fileList.appendChild(li);
                });
            } else {
                clearSelection();
            }
        }

        function removeFile(index) {
            selectedFiles.splice(index, 1);
            updateUI();
        }

        function clearSelection() {
            fileInput.value = '';
            cameraInput.value = '';
            selectedFiles = [];
            uploadPrompt.classList.remove('hidden');
            filePreview.classList.add('hidden');
            submitBtn.disabled = true;
            statusMessage.classList.add('hidden');
        }

        /* ---------- Yükleme ---------- */
        uploadForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            if (selectedFiles.length === 0) return;

            const guestName = document.getElementById('guestName').value.trim() || 'Misafir';

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<div class="loader"></div> Yükleniyor... (0/' + selectedFiles.length + ')';
            dropZone.style.pointerEvents = 'none';
            cameraBtn.disabled = true;

            showStatus('Anılarınız buluta aktarılıyor, lütfen sayfayı kapatmayın...', 'info');

            let successCount = 0;
            let errorCount = 0;
            let completedCount = 0;

            const uploadPromises = selectedFiles.map(async (file) => {
                try {
                    let base64Data;
                    let outMime = resolveMime(file);
                    let outName = file.name;

                    if (isImage(file)) {
                        // Sıkıştırma denenir; tarayıcı formatı çözemezse (HEIC vb.)
                        // orijinal dosya olduğu gibi yüklenir. Hata verilmez.
                        const compressed = await compressImage(file);
                        if (compressed) {
                            base64Data = compressed;
                            outMime = 'image/jpeg';
                            outName = outName.replace(/\.[^.]+$/, '') + '.jpg';
                        } else {
                            base64Data = await readFileAsBase64(file);
                        }
                    } else {
                        base64Data = await readFileAsBase64(file);
                    }

                    const base64Content = base64Data.split(',')[1];
                    const payload = {
                        fileName: outName,
                        originalName: file.name,
                        mimeType: outMime,
                        guestName: guestName,
                        fileData: base64Content
                    };

                    const response = await fetch(SCRIPT_URL, {
                        method: 'POST',
                        body: JSON.stringify(payload),
                        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
                    });

                    const result = await response.json();
                    if (result.success) { successCount++; } else { errorCount++; }
                } catch (error) {
                    console.error('Yükleme hatası:', file.name, error);
                    errorCount++;
                } finally {
                    completedCount++;
                    submitBtn.innerHTML = `<div class="loader"></div> Yükleniyor... (${completedCount}/${selectedFiles.length})`;
                }
            });

            await Promise.all(uploadPromises);

            dropZone.style.pointerEvents = 'auto';
            cameraBtn.disabled = false;
            submitBtn.innerHTML = 'Anıları Yükle';

            if (successCount > 0 && errorCount === 0) {
                showSuccess();
                setTimeout(() => { clearSelection(); }, 4000);
            } else if (successCount > 0 && errorCount > 0) {
                showStatus(`${successCount} dosya yüklendi, ${errorCount} dosya başarısız oldu.`, 'warning');
                submitBtn.disabled = false;
            } else {
                showStatus('Yükleme başarısız oldu. Lütfen tekrar deneyin.', 'error');
                submitBtn.disabled = false;
            }
        });

        function readFileAsBase64(file) {
            return new Promise((resolve, reject) => {
                const reader = new FileReader();
                reader.onload = () => resolve(reader.result);
                reader.onerror = error => reject(error);
                reader.readAsDataURL(file);
            });
        }

        /* Başarılıysa data URL, çözülemezse null döner. ASLA reject etmez. */
        function compressImage(file) {
            return new Promise((resolve) => {
                // createImageBitmap, HEIC'i destekleyen cihazlarda <img>'den daha güvenilir.
                const finish = (bitmapOrImg, w, h) => {
                    try {
                        const MAX = 1920;
                        let width = w, height = h;
                        if (width > height) {
                            if (width > MAX) { height *= MAX / width; width = MAX; }
                        } else {
                            if (height > MAX) { width *= MAX / height; height = MAX; }
                        }
                        const canvas = document.createElement('canvas');
                        canvas.width = Math.round(width);
                        canvas.height = Math.round(height);
                        const ctx = canvas.getContext('2d');
                        ctx.drawImage(bitmapOrImg, 0, 0, canvas.width, canvas.height);
                        const out = canvas.toDataURL('image/jpeg', 0.8);
                        // Boş/bozuk çıktı kontrolü
                        resolve(out && out.length > 100 ? out : null);
                    } catch (err) {
                        resolve(null);
                    }
                };

                if (typeof createImageBitmap === 'function') {
                    createImageBitmap(file)
                        .then(bmp => finish(bmp, bmp.width, bmp.height))
                        .catch(() => fallbackImg());
                } else {
                    fallbackImg();
                }

                function fallbackImg() {
                    const reader = new FileReader();
                    reader.onload = event => {
                        const img = new Image();
                        img.onload = () => finish(img, img.width, img.height);
                        img.onerror = () => resolve(null); // HEIC vb. → orijinali yükle
                        img.src = event.target.result;
                    };
                    reader.onerror = () => resolve(null);
                    reader.readAsDataURL(file);
                }
            });
        }

        function showStatus(message, type) {
            statusMessage.className = 'text-center mb-6 p-4 rounded-xl text-sm border';
            if (type === 'error') {
                statusMessage.classList.add('bg-red-50', 'border-red-200', 'text-red-700');
            } else if (type === 'info') {
                statusMessage.classList.add('bg-amber-50', 'border-amber-200', 'text-amber-800');
            } else if (type === 'warning') {
                statusMessage.classList.add('bg-yellow-50', 'border-yellow-200', 'text-yellow-800');
            }
            statusMessage.innerHTML = message;
            statusMessage.classList.remove('hidden');
        }

        function showSuccess() {
            statusMessage.className = 'text-center mb-6 p-2 rounded-xl bg-amber-50/60 border border-amber-200 shadow-inner';
            statusMessage.innerHTML = `
                <div class="celebration-wrapper">
                    <div class="heart-burst">
                        <i class="fa-solid fa-heart"></i>
                        <i class="fa-solid fa-check"></i>
                        <div class="sparkle sparkle-1"></div>
                        <div class="sparkle sparkle-2"></div>
                        <div class="sparkle sparkle-3"></div>
                        <div class="sparkle sparkle-4"></div>
                        <div class="sparkle sparkle-5"></div>
                        <div class="sparkle sparkle-6"></div>
                    </div>
                    <h3 class="celeb-title">Teşekkür Ederiz</h3>
                    <p class="celeb-text">Anılarınız defterimize sevgiyle eklendi.</p>
                </div>
            `;
            statusMessage.classList.remove('hidden');
        }
    </script>
</body>
</html>
